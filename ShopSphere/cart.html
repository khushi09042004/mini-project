<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShopSphere | Cart</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="site-header"></header>

  <main class="container py-5">
    <h1 class="page-title mb-4">My Shopping Cart</h1>
    <div class="row g-4">
      <div class="col-lg-8">
        <div id="cartItems" class="bg-white rounded p-3"></div>
      </div>
      <div class="col-lg-4">
        <div class="card p-3">
          <h4>Order Summary</h4>
          <p class="d-flex justify-content-between">Subtotal <span id="subtotal">₹0</span></p>
          <p class="d-flex justify-content-between">Delivery <span id="delivery">₹0</span></p>
          <hr>
          <h5 class="d-flex justify-content-between">Total <span id="total">₹0</span></h5>
          <a href="checkout.html" id="checkoutBtn" class="btn btn-primary mt-3">Proceed to Checkout</a>
          <a href="products.html" class="btn btn-outline-secondary mt-2">Continue Shopping</a>
        </div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>
  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="products.js"></script>
  <script src="common.js"></script>
  <script src="cart.js"></script>
</body>
</html>
