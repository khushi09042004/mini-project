
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShopSphere | Checkout</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header"></header>

  <main class="container py-5">
    <h1 class="page-title text-center mb-4">Checkout</h1>

    <div class="form-card">
      <div id="checkoutSummary" class="alert alert-light"></div>

      <form id="checkoutForm">
        <div class="mb-3">
          <label for="customerName" class="form-label">Full Name</label>
          <input id="customerName" name="customerName" class="form-control"
            maxlength="80" required>
        </div>

        <div class="mb-3">
          <label for="customerEmail" class="form-label">Email</label>
          <input type="email" id="customerEmail" name="customerEmail"
            class="form-control" required>
        </div>

        <div class="mb-3">
          <label for="customerPhone" class="form-label">Phone Number</label>
          <input type="tel" id="customerPhone" name="customerPhone"
            class="form-control" pattern="[0-9]{10}" maxlength="10"
            placeholder="10-digit number" required>
        </div>

        <div class="mb-3">
          <label for="address" class="form-label">Delivery Address</label>
          <textarea id="address" name="address" class="form-control"
            rows="3" maxlength="300" required></textarea>
        </div>

        <div class="mb-3">
          <label for="paymentMethod" class="form-label">Payment Method</label>
          <select id="paymentMethod" name="paymentMethod"
            class="form-select" required>
            <option value="Cash on Delivery">Cash on Delivery </option>
            <option value="Online Payment">Online Payment </option>
          </select>
        </div>

        <button type="submit" class="btn btn-success w-100">
          Place Order
        </button>
      </form>

      <p id="checkoutMessage" class="mt-3" role="status"></p>
    </div>
  </main>

  <div id="site-footer"></div>
  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="products.js"></script>
  <script src="common.js"></script>
  <script src="checkout.js"></script>
</body>
</html>
