
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShopSphere | Register</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="site-header"></header>

  <main class="container py-5">
    <div class="form-card">
      <h1 class="page-title mb-4">Create Account</h1>

      <form id="registerForm">
        <div class="mb-3">
          <label for="registerName" class="form-label">Full Name</label>
          <input id="registerName" class="form-control" maxlength="80" required>
        </div>

        <div class="mb-3">
          <label for="registerEmail" class="form-label">Email</label>
          <input type="email" id="registerEmail" class="form-control" required>
        </div>

        <div class="mb-3">
          <label for="registerPassword" class="form-label">Password</label>
          <input type="password" id="registerPassword"
            class="form-control" minlength="6" required>
        </div>

        <button type="submit" class="btn btn-success w-100">Register </button>
      </form>

      <p id="registerMessage" class="mt-3" role="status"></p>
      <p>Already registered? <a href="login.html">Login</a></p>
      <small class="text-muted"> Your password is not saved.</small>
    </div>
  </main>

  <div id="site-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="common.js"></script>
  <script src="authentation.js"></script>
</body>
</html>
